version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging into Docker Hub"
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin

  build:
    commands:
      - docker build -t brain-task-app .
      - docker tag brain-task-app $DOCKER_USERNAME/project-brain-task-app

  post_build:
    commands:
      - docker push $DOCKER_USERNAME/project-brain-task-app

artifacts:
  files:
    - '**/*'

